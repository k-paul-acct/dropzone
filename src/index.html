<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DropZone</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="stylesheet" href="/style.css" />
    </head>

    <body>
        <header>
            <h1>Drop<span>Zone</span> 🚀</h1>
            <p>Send files or messages to this device instantly</p>
        </header>

        <div class="grid">
            <div class="card">
                <h2>📁 Send Files</h2>
                <div class="drop-area" id="drop-area">
                    <div class="drop-icon">⬆️</div>
                    <p><strong>Click or drag & drop</strong></p>
                    <p>any file type accepted</p>
                    <input type="file" id="file-input" multiple />
                </div>
                <div id="file-list"></div>
                <button type="submit" id="upload-btn" disabled>Upload</button>
            </div>

            <div class="card">
                <h2>💬 Send Message</h2>
                <textarea
                    id="msg-input"
                    placeholder="Type your message here..."
                ></textarea>
                <button type="submit" id="send-btn">Send</button>
            </div>
        </div>

        <div class="toast-container" id="toasts"></div>

        <script>
            const dropArea = document.getElementById("drop-area");
            const fileInput = document.getElementById("file-input");
            const fileList = document.getElementById("file-list");
            const uploadBtn = document.getElementById("upload-btn");
            const msgInput = document.getElementById("msg-input");
            const sendBtn = document.getElementById("send-btn");
            const toastsCtr = document.getElementById("toasts");

            let selectedFiles = [];

            function toast(msg, ok = true) {
                const el = document.createElement("div");
                el.className = "toast" + (ok ? "" : " error");
                el.textContent = msg;
                toastsCtr.appendChild(el);
                setTimeout(() => el.remove(), 3000);
            }

            function updateFileList() {
                fileList.innerHTML = "";
                fileList.style.display = "none";

                selectedFiles.forEach((f) => {
                    const d = document.createElement("div");
                    d.className = "file-list-item";

                    const s = document.createElement("span");
                    s.textContent = f.name;

                    const r = document.createElement("button");
                    r.textContent = "Remove";
                    r.className = "btn-remove";
                    r.setAttribute("type", "button");
                    r.onclick = () => {
                        d.remove();
                        selectedFiles = selectedFiles.filter(
                            (item) => item !== f,
                        );
                        if (selectedFiles.length === 0) {
                            uploadBtn.disabled = true;
                            fileList.style.display = "none";
                        } else {
                            uploadBtn.disabled = false;
                            fileList.style.display = "flex";
                        }
                    };

                    d.appendChild(s);
                    d.appendChild(r);

                    fileList.appendChild(d);
                });

                if (selectedFiles.length === 0) {
                    uploadBtn.disabled = true;
                    fileList.style.display = "none";
                } else {
                    uploadBtn.disabled = false;
                    fileList.style.display = "flex";
                }
            }

            fileInput.addEventListener("change", () => {
                selectedFiles = Array.from(fileInput.files);
                updateFileList();
            });

            dropArea.addEventListener("dragover", (e) => {
                e.preventDefault();
                dropArea.classList.add("drag-over");
            });

            dropArea.addEventListener("dragleave", () =>
                dropArea.classList.remove("drag-over"),
            );

            dropArea.addEventListener("drop", (e) => {
                e.preventDefault();
                dropArea.classList.remove("drag-over");
                selectedFiles = Array.from(e.dataTransfer.files);
                updateFileList();
            });

            uploadBtn.addEventListener("click", async () => {
                if (!selectedFiles.length) {
                    return;
                }

                const fd = new FormData();
                selectedFiles.forEach((f, i, _) => fd.append(`files${i}`, f));
                uploadBtn.disabled = true;
                uploadBtn.textContent = "Uploading...";

                try {
                    const res = await fetch("/upload", {
                        method: "POST",
                        body: fd,
                    });
                    if (res.ok) {
                        toast(`✅ ${selectedFiles.length} file(s) sent`);
                        selectedFiles = [];
                        updateFileList();
                    } else {
                        toast("❌ Upload failed", false);
                    }
                } catch {
                    toast("❌ Network error", false);
                }

                uploadBtn.disabled = false;
                uploadBtn.textContent = "Upload";
            });

            sendBtn.addEventListener("click", async () => {
                const text = msgInput.value.trim();
                if (!text) {
                    return;
                }

                sendBtn.disabled = true;
                sendBtn.textContent = "Sending...";

                try {
                    const fd = new FormData();
                    fd.append("message", text);
                    const res = await fetch("/message", {
                        method: "POST",
                        body: fd,
                    });
                    if (res.ok) {
                        toast("✅ Message sent");
                        msgInput.value = "";
                    } else {
                        toast("❌ Failed to send", false);
                    }
                } catch {
                    toast("❌ Network error", false);
                }

                sendBtn.disabled = false;
                sendBtn.textContent = "Send";
            });
        </script>
    </body>
</html>
